<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-text-main/20 backdrop-blur-sm p-4 animate-in fade-in duration-200"
>
  <div
    class="bg-surface w-full max-w-2xl rounded-3xl shadow-xl border border-border-main/10 flex flex-col max-h-[90vh] animate-in slide-in-from-bottom-4 duration-300"
  >
    <header class="flex items-center justify-between p-6 border-b border-border-main/10">
      <h2 class="text-2xl font-bold text-text-main">Nuevo Proyecto</h2>
      <button
        (click)="closeModal()"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-border-main/10 text-muted hover:text-text-main transition-colors"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
      <form [formGroup]="projectForm" id="projectForm" (ngSubmit)="onSubmit()" class="space-y-6">
        @if (errorMessage) {
          <div
            class="p-4 rounded-xl bg-danger/10 border border-danger/20 text-danger text-sm font-medium"
          >
            {{ errorMessage }}
          </div>
        }

        <div>
          <label for="title" class="block text-sm font-medium text-text-main mb-2"
            >Título del proyecto <span class="text-danger">*</span></label
          >
          <input
            type="text"
            id="title"
            formControlName="title"
            placeholder="Ej: Vestido de lino cruzado"
            class="w-full h-12 px-4 rounded-xl border border-border-main/20 bg-bg text-text-main outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            [class.border-danger]="
              projectForm.get('title')?.invalid && projectForm.get('title')?.touched
            "
          />
        </div>

        <div>
          <label for="description" class="block text-sm font-medium text-text-main mb-2"
            >Descripción</label
          >
          <textarea
            id="description"
            formControlName="description"
            placeholder="Apunta tus ideas, inspiración o detalles importantes..."
            rows="3"
            class="w-full p-4 rounded-xl border border-border-main/20 bg-bg text-text-main outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="status" class="block text-sm font-medium text-text-main mb-2">Estado</label>
            <select
              id="status"
              formControlName="status"
              class="w-full h-12 px-4 rounded-xl border border-border-main/20 bg-bg text-text-main outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all appearance-none cursor-pointer"
            >
              <option value="Planificado">Planificado</option>
              <option value="En curso">En curso</option>
              <option value="Pausado">Pausado</option>
              <option value="Finalizado">Finalizado</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-text-main mb-2">Visibilidad</label>
            <label
              class="flex items-center gap-3 h-12 px-4 rounded-xl border border-border-main/20 bg-bg cursor-pointer hover:border-primary/50 transition-colors"
            >
              <input
                type="checkbox"
                formControlName="isPublic"
                class="accent-primary w-4 h-4 cursor-pointer"
              />
              <span class="text-sm text-text-main font-medium"
                >Público (Visible para la comunidad)</span
              >
            </label>
          </div>
        </div>

        <hr class="border-border-main/10" />

        <div>
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-text-main">Materiales</h3>
            <button
              type="button"
              (click)="addMaterial()"
              class="text-primary text-sm font-bold flex items-center gap-1 hover:underline"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              Añadir material
            </button>
          </div>

          <div formArrayName="materials" class="space-y-3">
            @for (material of materials.controls; track $index) {
              <div
                [formGroupName]="$index"
                class="flex items-start gap-3 bg-bg p-3 rounded-xl border border-border-main/10"
              >
                <div class="flex-1 space-y-2">
                  <input
                    type="text"
                    formControlName="name"
                    placeholder="Nombre (ej: Tela de lino)"
                    class="w-full h-10 px-3 text-sm rounded-lg border border-border-main/20 bg-surface outline-none focus:border-primary"
                  />
                  <input
                    type="text"
                    formControlName="quantity"
                    placeholder="Cantidad (ej: 2 metros)"
                    class="w-full h-10 px-3 text-sm rounded-lg border border-border-main/20 bg-surface outline-none focus:border-primary"
                  />
                </div>
                <button
                  type="button"
                  (click)="removeMaterial($index)"
                  class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-danger/10 text-danger hover:bg-danger hover:text-white transition-colors"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                    />
                  </svg>
                </button>
              </div>
            }
            @if (materials.length === 0) {
              <p
                class="text-sm text-muted text-center py-4 bg-bg rounded-xl border border-dashed border-border-main/20"
              >
                Aún no has añadido materiales.
              </p>
            }
          </div>
        </div>
      </form>
    </div>

    <footer
      class="p-6 border-t border-border-main/10 bg-surface rounded-b-3xl flex justify-end gap-3"
    >
      <button type="button" (click)="closeModal()" class="btn btn-secondary px-6">Cancelar</button>
      <button
        type="submit"
        form="projectForm"
        [disabled]="projectForm.invalid || isLoading"
        class="btn btn-primary px-8 flex items-center justify-center min-w-[140px]"
      >
        @if (isLoading) {
          <svg
            class="animate-spin h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        } @else {
          Crear proyecto
        }
      </button>
    </footer>
  </div>
</div>
