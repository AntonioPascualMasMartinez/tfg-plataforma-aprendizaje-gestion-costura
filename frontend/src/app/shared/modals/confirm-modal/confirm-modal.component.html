@if (isOpen) {
  <div
    class="fixed inset-0 z-100 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity"
  >
    <div
      class="bg-surface w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-border-main/10 transform transition-all"
    >
      <div class="p-6 md:p-8">
        <h2 class="font-display font-bold text-text-main text-2xl mb-3">
          {{ title }}
        </h2>
        <p class="text-muted text-[15px] leading-relaxed mb-8">
          {{ message }}
        </p>

        <div class="flex flex-col-reverse sm:flex-row justify-end gap-3">
          <button
            class="btn btn-secondary w-full sm:w-auto"
            (click)="onCancel()"
            [disabled]="isLoading"
          >
            {{ cancelText }}
          </button>

          <button
            class="btn w-full sm:w-auto"
            [ngClass]="isDestructive ? 'btn-danger' : 'btn-primary'"
            (click)="onConfirm()"
            [disabled]="isLoading"
          >
            @if (isLoading) {
              <svg
                class="animate-spin -ml-1 mr-2 h-5 w-5 text-white"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Procesando...
            } @else {
              {{ confirmText }}
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
