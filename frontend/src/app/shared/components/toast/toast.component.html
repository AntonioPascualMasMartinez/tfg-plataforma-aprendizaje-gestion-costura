<div
  class="fixed bottom-4 right-4 md:bottom-8 md:right-8 z-9999 flex flex-col gap-3 pointer-events-none"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 px-4 py-3 w-80 max-w-[calc(100vw-2rem)] rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-300 animate-fade-in-up"
      [ngClass]="getToastClasses(toast.type)"
    >
      <div class="shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        } @else if (toast.type === 'error') {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        } @else {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"
            />
          </svg>
        }
      </div>

      <p class="text-[14px] font-medium leading-tight flex-1">
        {{ toast.message }}
      </p>

      <button
        (click)="toastService.remove(toast.id)"
        class="shrink-0 text-current opacity-60 hover:opacity-100 transition-opacity p-1 rounded-lg"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
