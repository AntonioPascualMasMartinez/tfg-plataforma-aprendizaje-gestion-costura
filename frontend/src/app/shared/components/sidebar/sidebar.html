<aside
  class="hidden md:flex flex-col w-[260px] h-screen fixed left-0 top-0 bg-surface border-r border-border-main/10 z-50"
>
  <div class="h-24 flex items-center px-8 mb-4 border-b border-border-main/5">
    <a
      routerLink="/home"
      class="flex items-center gap-3 focus-visible:outline-focus rounded-lg group"
    >
      <img
        src="/logo/logo.png"
        alt="Logo de Needly"
        class="w-10 h-10 object-contain transition-transform duration-300 group-hover:scale-110"
      />
      <span class="font-display text-[22px] font-bold text-text-main tracking-tight">Needly</span>
    </a>
  </div>

  <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-primary/5 text-primary border-primary shadow-sm"
        [routerLinkActiveOptions]="{ exact: false }"
        #rla="routerLinkActive"
        class="flex items-center gap-4 px-4 py-3.5 rounded-xl border border-transparent text-[15px] font-medium transition-all duration-300 group focus-visible:outline-focus hover:bg-surface hover:shadow-sm hover:border-border-main/10"
        [class.text-muted]="!rla.isActive"
      >
        <div
          class="relative flex items-center justify-center transition-transform duration-300 group-hover:scale-110"
          [class.text-primary]="rla.isActive"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
            [innerHTML]="item.icon"
          ></svg>
        </div>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-4 border-t border-border-main/10">
    <button
      (click)="onLogout()"
      [disabled]="isLoadingLogout"
      class="flex items-center gap-4 px-4 py-3.5 w-full rounded-xl text-[15px] font-medium text-muted hover:text-danger hover:bg-danger/5 transition-all duration-300 focus-visible:outline-focus disabled:opacity-50 group"
    >
      @if (isLoadingLogout) {
        <svg
          class="animate-spin w-6 h-6 text-danger"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span>Saliendo...</span>
      } @else {
        <svg
          class="w-6 h-6 transform group-hover:-translate-x-1 transition-transform"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
          />
        </svg>
        <span>Cerrar sesión</span>
      }
    </button>
  </div>
</aside>

<nav
  class="md:hidden fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-border-main/10 z-50 px-2 pb-safe pt-2 flex justify-between items-center shadow-[0_-10px_40px_rgba(0,0,0,0.05)]"
>
  @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="text-primary scale-110"
      [routerLinkActiveOptions]="{ exact: false }"
      #rlaMobile="routerLinkActive"
      class="flex flex-col items-center justify-center w-16 h-14 relative text-muted transition-all duration-300"
    >
      @if (rlaMobile.isActive) {
        <span class="absolute top-0 w-8 h-1 bg-primary rounded-b-full"></span>
      }
      <svg
        class="w-6 h-6 mb-1"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
        [innerHTML]="item.icon"
      ></svg>
      <span class="text-[10px] font-medium" [class.font-bold]="rlaMobile.isActive">{{
        item.label
      }}</span>
    </a>
  }
</nav>
