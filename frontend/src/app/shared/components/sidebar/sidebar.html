<aside
  class="hidden md:flex flex-col w-65 h-screen fixed left-0 top-0 bg-surface border-r border-border-main/20 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-50 select-none"
  aria-label="Barra lateral de navegación"
>
  <div class="h-24 flex items-center px-8 mb-2">
    <a
      routerLink="/home"
      aria-label="Needly - Ir al panel principal"
      class="flex items-center gap-3 focus-visible:outline-focus rounded-xl group cursor-pointer outline-offset-4"
    >
      <img
        src="/logo/logo.webp"
        alt=""
        aria-hidden="true"
        class="w-9 h-9 object-contain transition-all duration-300 ease-out group-hover:scale-110 group-hover:rotate-3 drop-shadow-sm"
      />
      <span
        class="font-display text-[22px] font-bold text-text-main tracking-tight transition-colors group-hover:text-primary"
      >
        Needly
      </span>
    </a>
  </div>

  <nav
    class="flex-1 px-3 space-y-1.5 overflow-y-auto custom-scrollbar"
    aria-label="Navegación principal del usuario"
  >
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-primary/10! shadow-sm"
        [routerLinkActiveOptions]="{ exact: false }"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="relative flex items-center gap-3.5 px-4 py-3 rounded-xl text-[14px] font-semibold transition-all duration-300 ease-out group cursor-pointer focus-visible:outline-focus hover:bg-surface-hover"
        [class.text-text-main]="rla.isActive"
        [class.text-muted]="!rla.isActive"
      >
        @if (rla.isActive) {
          <div
            aria-hidden="true"
            class="absolute left-0 w-1 h-6 bg-primary rounded-r-full shadow-[0_0_12px_rgba(202,71,0,0.4)]"
          ></div>
        }

        <div
          class="relative flex items-center justify-center p-1.5 rounded-lg transition-all duration-300 group-hover:scale-110"
          [class.text-primary]="rla.isActive"
          aria-hidden="true"
        >
          <svg
            class="w-5 h-5 transition-colors duration-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            [innerHTML]="item.safeIcon"
          ></svg>
        </div>
        <span class="tracking-wide" [class.font-bold]="rla.isActive">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-4 border-t border-border-main/10 mt-auto flex flex-col gap-1">
    @if (isAdmin) {
      <a
        routerLink="/admin/dashboard"
        aria-label="Acceder al Panel de Administración"
        class="flex items-center gap-3.5 px-4 py-3 w-full rounded-xl text-[14px] font-semibold text-primary bg-primary/10 hover:bg-primary/20 transition-all duration-300 focus-visible:outline-focus cursor-pointer group mb-2"
      >
        <svg
          aria-hidden="true"
          class="w-5 h-5 transform group-hover:scale-110 transition-transform duration-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
        <span class="tracking-wide">Panel de Admin</span>
      </a>
    }

    <button
      (click)="toggleTheme()"
      [attr.aria-label]="isDarkMode ? 'Activar modo claro' : 'Activar modo oscuro'"
      class="flex items-center gap-3.5 px-4 py-3 w-full rounded-xl text-[14px] font-semibold text-muted hover:text-primary hover:bg-surface-hover transition-all duration-300 focus-visible:outline-focus cursor-pointer group"
    >
      <div
        aria-hidden="true"
        class="relative w-5 h-5 flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="absolute w-5 h-5 transition-all duration-500"
          [ngClass]="isDarkMode ? 'opacity-0 rotate-90 scale-50' : 'opacity-100 rotate-0 scale-100'"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
          />
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="absolute w-5 h-5 transition-all duration-500"
          [ngClass]="
            isDarkMode ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-50'
          "
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>
      </div>
      <span class="tracking-wide">Cambiar apariencia</span>
    </button>

    <button
      (click)="requestLogout()"
      [disabled]="isLoadingLogout"
      [attr.aria-busy]="isLoadingLogout"
      class="flex items-center gap-3.5 px-4 py-3 w-full rounded-xl text-[14px] font-semibold text-muted hover:text-danger hover:bg-danger/10 transition-all duration-300 focus-visible:outline-focus cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed group"
    >
      @if (isLoadingLogout) {
        <svg
          aria-hidden="true"
          class="animate-spin w-5 h-5 text-danger"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span>Saliendo...</span>
      } @else {
        <svg
          aria-hidden="true"
          class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform duration-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
          />
        </svg>
        <span class="tracking-wide">Cerrar sesión</span>
      }
    </button>
  </div>
</aside>

<nav
  class="md:hidden fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl border-t border-border-main/20 z-50 px-4 pb-safe pt-2 flex justify-around items-center shadow-[0_-10px_40px_rgba(0,0,0,0.08)] select-none"
  aria-label="Navegación inferior móvil"
>
  @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="text-primary"
      [routerLinkActiveOptions]="{ exact: false }"
      #rlaMobile="routerLinkActive"
      [attr.aria-current]="rlaMobile.isActive ? 'page' : null"
      class="flex flex-col items-center justify-center w-16 h-14 relative text-muted transition-all duration-300 ease-out cursor-pointer focus-visible:outline-focus rounded-lg"
      [class.-translate-y-1]="rlaMobile.isActive"
    >
      @if (rlaMobile.isActive) {
        <span
          aria-hidden="true"
          class="absolute -top-2 w-8 h-1 bg-primary rounded-b-full shadow-[0_2px_8px_rgba(var(--color-primary),0.5)]"
        ></span>
      }
      <div
        class="transition-transform duration-300"
        [class.scale-110]="rlaMobile.isActive"
        aria-hidden="true"
      >
        <svg
          class="w-5.5 h-5.5 mb-1"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          [innerHTML]="item.safeIcon"
        ></svg>
      </div>
      <span
        class="text-[10px] font-semibold tracking-wide transition-all"
        [class.font-bold]="rlaMobile.isActive"
      >
        {{ item.label }}
      </span>
    </a>
  }
</nav>

<app-confirm-modal
  [isOpen]="showLogoutModal"
  title="Cerrar sesión"
  message="¿Estás seguro de que deseas salir de tu cuenta de Needly? Tendrás que volver a ingresar tus credenciales para acceder a tus proyectos."
  confirmText="Sí, salir"
  cancelText="Cancelar"
  [isDestructive]="true"
  [isLoading]="isLoadingLogout"
  (confirm)="confirmLogout()"
  (cancel)="cancelLogout()"
></app-confirm-modal>
