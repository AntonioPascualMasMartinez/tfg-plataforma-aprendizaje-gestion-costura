<article
  class="group flex flex-col h-full bg-surface/95 backdrop-blur-md rounded-[2.5rem] border border-border-main/10 shadow-xl shadow-black/5 overflow-hidden transition-all duration-500 ease-out hover:-translate-y-2 hover:border-primary/40 hover:shadow-[0_24px_48px_-12px_rgba(255,89,0,0.15)] hover:drop-shadow-[0_8px_8px_rgba(255,89,0,0.05)] relative cursor-pointer"
  (click)="onCardClick()"
>
  <div
    class="relative h-44 md:h-48 w-full bg-bg/50 overflow-hidden shrink-0 border-b border-border-main/5"
  >
    @if (coverImage) {
      <img
        [src]="coverImage"
        [alt]="'Imagen del tutorial ' + tutorial.title"
        class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
      />
      <div
        class="absolute inset-0 bg-linear-to-b from-black/60 via-black/10 to-transparent pointer-events-none"
      ></div>
    } @else {
      <div
        class="absolute inset-0 flex flex-col items-center justify-center bg-surface transition-colors duration-500 group-hover:bg-primary/5"
      >
        <svg
          class="w-12 h-12 mb-2 opacity-20 text-text-main group-hover:text-primary transition-colors duration-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"
          />
        </svg>
      </div>
    }

    <div
      class="absolute top-3.5 left-3.5 right-3.5 z-10 flex flex-wrap items-center gap-2 pointer-events-none"
    >
      <div
        class="flex items-center gap-2 px-3 py-1.5 bg-surface/90 backdrop-blur-md text-text-main text-[10px] md:text-[11px] font-bold rounded-2xl border border-border-main/10 shadow-sm transition-all"
      >
        <div
          class="flex items-center justify-center w-5 h-5 rounded-full bg-primary/10 text-primary"
        >
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"
            />
          </svg>
        </div>
        <span class="tracking-tight">{{ tutorial.category }}</span>
      </div>

      <div
        class="flex items-center gap-2 px-3 py-1.5 text-[10px] md:text-[11px] font-bold rounded-2xl border backdrop-blur-md shadow-sm transition-all"
        [ngClass]="difficultyColorClass"
      >
        <svg class="w-3.5 h-3.5 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
          />
        </svg>
        <span class="tracking-tight">Nivel {{ tutorial.difficultyLevel }}</span>
      </div>
    </div>
  </div>

  <div class="p-6 md:p-8 flex flex-col flex-1 relative bg-surface z-20">
    <h3
      class="font-display font-bold text-text-main text-[22px] leading-tight group-hover:text-primary transition-colors duration-300 line-clamp-2 mb-3"
    >
      {{ tutorial.title }}
    </h3>

    <p
      class="text-[14px] text-muted mb-4 line-clamp-2 flex-1 leading-relaxed group-hover:text-text-main/80 transition-colors duration-300"
    >
      {{ tutorial.description }}
    </p>

    <div class="flex items-center justify-between pt-5 border-t border-border-main/10 mt-auto">
      <div class="flex items-center gap-4">
        <div
          class="flex items-center gap-1.5 text-muted group-hover:text-text-main/90 transition-colors"
          title="Tiempo estimado"
        >
          <svg
            class="w-4.5 h-4.5 text-primary/70 group-hover:text-primary transition-colors"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span class="text-[13px] font-semibold">{{ formattedTime }}</span>
        </div>

        <div
          class="flex items-center gap-1.5 text-muted group-hover:text-text-main/90 transition-colors"
          title="Número de pasos"
        >
          <svg
            class="w-4.5 h-4.5 text-primary/70 group-hover:text-primary transition-colors"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"
            />
          </svg>
          <span class="text-[13px] font-semibold">{{ tutorial.steps.length || 0 }} pasos</span>
        </div>
      </div>

      <div
        class="w-8 h-8 rounded-full bg-surface border border-border-main/10 flex items-center justify-center text-primary shadow-sm group-hover:bg-primary group-hover:text-white group-hover:scale-110 group-hover:shadow-[0_4px_12px_rgba(255,89,0,0.3)] transition-all duration-300"
        title="Ver detalles"
      >
        <svg
          class="w-4 h-4 translate-x-px"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </div>
    </div>
  </div>
</article>
