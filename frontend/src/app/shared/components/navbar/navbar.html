<header
  class="w-full fixed top-0 z-50 transition-all duration-500"
  [ngClass]="{
    'bg-surface/80 backdrop-blur-xl py-3 shadow-[0_4px_30px_rgba(0,0,0,0.05)] border-b border-border-main/10':
      isScrolled(),
    'bg-transparent py-5 border-b border-transparent': !isScrolled(),
  }"
>
  <div class="max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center">
    <a
      routerLink="/"
      aria-label="Ir al inicio"
      class="flex items-center gap-2 focus-visible:outline-focus rounded-xl px-1 group outline-offset-4"
    >
      <img
        src="/logo/logo.png"
        alt="Logo de Needly"
        class="w-12 h-12 md:w-14 md:h-14 object-contain transition-all duration-500 ease-out group-hover:scale-110 group-hover:rotate-[-5deg]"
        [class.invert]="isDarkMode()"
      />
      <span class="font-display text-[22px] md:text-[24px] font-bold text-text-main tracking-tight">
        Needly
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-8" aria-label="Navegación principal">
      <a
        href="/#encontrar"
        class="nav-link cursor-pointer"
        [class.active]="activeSection() === 'encontrar'"
        >Encontrar</a
      >
      <a
        href="/#funcionamiento"
        class="nav-link cursor-pointer"
        [class.active]="activeSection() === 'funcionamiento'"
        >Funcionamiento</a
      >
      <a
        href="/#tutoriales"
        class="nav-link cursor-pointer"
        [class.active]="activeSection() === 'tutoriales'"
        >Biblioteca</a
      >
      <a
        href="/#comunidad"
        class="nav-link cursor-pointer"
        [class.active]="activeSection() === 'comunidad'"
        >Comunidad</a
      >
    </nav>

    <div class="flex items-center gap-3 sm:gap-5">
      <button
        (click)="toggleTheme()"
        class="relative flex items-center justify-center w-10 h-10 rounded-full text-text-main hover:bg-black/10 dark:hover:bg-white/20 transition-all duration-300 hover:scale-105 cursor-pointer focus-visible:outline-focus"
        [attr.aria-label]="isDarkMode() ? 'Activar modo claro' : 'Activar modo oscuro'"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-5 h-5 absolute transition-all duration-500 ease-spring"
          [ngClass]="
            isDarkMode() ? 'opacity-0 rotate-90 scale-50' : 'opacity-100 rotate-0 scale-100'
          "
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
          />
        </svg>

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6 absolute transition-all duration-500 ease-spring"
          [ngClass]="
            isDarkMode() ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-50'
          "
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>
      </button>

      <div class="hidden sm:flex items-center gap-4">
        <a
          routerLink="/auth/login"
          class="text-[15px] font-semibold text-text-main hover:text-primary transition-colors duration-300 focus-visible:outline-focus rounded-md px-2 py-1"
        >
          Iniciar sesión
        </a>
        <a
          routerLink="/auth/register"
          class="btn btn-primary relative overflow-hidden group shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:-translate-y-0.5 transition-all duration-300"
        >
          <span class="relative z-10">Regístrate gratis</span>
          <div
            class="absolute inset-0 h-full w-full bg-linear-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-shimmer z-0"
          ></div>
        </a>
      </div>

      <button
        class="md:hidden flex items-center justify-center p-2 text-text-main hover:text-primary transition-colors focus-visible:outline-focus rounded-lg cursor-pointer"
        (click)="toggleMobileMenu($event)"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-menu"
        aria-label="Alternar menú de navegación"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-7 h-7 transition-transform duration-500 ease-spring"
          [ngClass]="{ 'rotate-90': isMobileMenuOpen() }"
        >
          @if (!isMobileMenuOpen()) {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          }
        </svg>
      </button>
    </div>
  </div>

  <div
    class="md:hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[-1] transition-opacity duration-300 cursor-pointer"
    [ngClass]="{
      'opacity-100 visible': isMobileMenuOpen(),
      'opacity-0 invisible pointer-events-none': !isMobileMenuOpen(),
    }"
    (click)="closeMobileMenu()"
    aria-hidden="true"
  ></div>

  <div
    id="mobile-menu"
    class="md:hidden absolute top-[110%] left-4 right-4 bg-surface/95 backdrop-blur-2xl border border-border-main/10 shadow-2xl rounded-3xl overflow-hidden transition-all duration-500 ease-spring origin-top"
    [ngClass]="{
      'scale-100 opacity-100 visible translate-y-0': isMobileMenuOpen(),
      'scale-95 opacity-0 invisible -translate-y-4 pointer-events-none': !isMobileMenuOpen(),
    }"
  >
    <nav class="flex flex-col p-6 gap-2">
      <a
        href="/#encontrar"
        (click)="closeMobileMenu()"
        class="mobile-nav-link cursor-pointer"
        [class.active]="activeSection() === 'encontrar'"
      >
        <span class="text-xl">Encontrar</span>
        <svg class="w-5 h-5 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>
      <a
        href="/#funcionamiento"
        (click)="closeMobileMenu()"
        class="mobile-nav-link cursor-pointer"
        [class.active]="activeSection() === 'funcionamiento'"
      >
        <span class="text-xl">Funcionamiento</span>
      </a>
      <a
        href="/#tutoriales"
        (click)="closeMobileMenu()"
        class="mobile-nav-link cursor-pointer"
        [class.active]="activeSection() === 'tutoriales'"
      >
        <span class="text-xl">Biblioteca</span>
      </a>
      <a
        href="/#comunidad"
        (click)="closeMobileMenu()"
        class="mobile-nav-link cursor-pointer"
        [class.active]="activeSection() === 'comunidad'"
      >
        <span class="text-xl">Comunidad</span>
      </a>

      <div class="h-px bg-border-main/10 my-4"></div>

      <div class="flex flex-col gap-3">
        <a
          routerLink="/auth/login"
          (click)="closeMobileMenu()"
          class="btn btn-secondary w-full py-3 text-lg"
        >
          Iniciar sesión
        </a>
        <a
          routerLink="/auth/register"
          (click)="closeMobileMenu()"
          class="btn btn-primary w-full py-3 text-lg"
        >
          Regístrate gratis
        </a>
      </div>
    </nav>
  </div>
</header>
