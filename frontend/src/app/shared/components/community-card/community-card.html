<article
  class="group rounded-3xl overflow-hidden bg-surface border border-border-main/15 shadow-[0_14px_30px_rgba(0,0,0,0.08)] hover:shadow-[0_20px_40px_rgba(0,0,0,0.12)] hover:-translate-y-1 transition-all duration-300 h-full"
>
  <div class="relative h-64 overflow-hidden">
    <img
      [src]="imageUrl"
      alt="Proyecto de la comunidad por {{ authorName }}"
      class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
    />
  </div>
  <div
    class="bg-surface px-5 py-4 flex items-center justify-between border-t border-border-main/10 relative z-20"
  >
    <div class="flex items-center gap-3">
      <span
        class="w-8 h-8 rounded-full bg-border-main/20 overflow-hidden flex items-center justify-center"
      >
        <span class="text-[12px] text-text-main font-semibold">{{ authorInitials }}</span>
      </span>
      <span class="text-[13px] text-text-main/80 font-medium">{{ authorName }}</span>
    </div>

    <button
      class="flex items-center gap-2 text-muted hover:text-like transition-colors group/btn"
      aria-label="Dar me gusta"
    >
      <svg
        class="w-5 h-5 transition-transform group-hover/btn:scale-110 group-hover/btn:fill-like"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
        />
      </svg>
      <span class="text-[13px] font-semibold transition-colors group-hover/btn:text-like">{{
        likes
      }}</span>
    </button>
  </div>
</article>
