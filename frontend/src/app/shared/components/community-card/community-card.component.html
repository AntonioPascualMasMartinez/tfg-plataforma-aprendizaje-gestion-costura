<div
  (click)="onCardClick()"
  class="group flex flex-col bg-surface border border-border-main/15 rounded-2xl overflow-hidden hover:shadow-[0_12px_40px_rgba(0,0,0,0.06)] hover:border-primary/30 transition-all duration-500 cursor-pointer h-full relative"
>
  <div class="relative w-full aspect-4/5 bg-bg overflow-hidden flex items-center justify-center">
    @if (project.inspirationImageUrl) {
      <img
        [src]="project.inspirationImageUrl"
        [alt]="project.title"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
        loading="lazy"
      />
    } @else {
      <div
        class="w-full h-full bg-linear-to-br from-surface to-primary/10 flex items-center justify-center group-hover:scale-105 transition-transform duration-700 ease-out"
      >
        <svg
          class="w-16 h-16 text-primary/20"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
          />
        </svg>
      </div>
    }

    <div
      class="absolute inset-0 bg-linear-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"
    ></div>

    <div class="absolute top-3 left-3 flex flex-wrap gap-1.5 z-10">
      <span
        class="px-2 py-1 bg-surface/90 backdrop-blur-md text-[10px] font-bold rounded shadow-sm uppercase text-primary border border-border-main/10"
      >
        {{ project.category || 'Costura' }}
      </span>
      <span
        class="px-2 py-1 bg-surface/90 backdrop-blur-md text-[10px] font-bold rounded shadow-sm uppercase text-text-main border border-border-main/10"
      >
        {{ project.difficulty }}
      </span>
    </div>

    <button
      (click)="onReportClick($event)"
      class="absolute top-3 right-3 z-20 p-1.5 bg-surface/70 hover:bg-surface/90 backdrop-blur-md rounded-full text-muted hover:text-red-500 transition-all shadow-sm opacity-0 group-hover:opacity-100 focus:opacity-100 cursor-pointer"
      title="Reportar proyecto"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 3v1.5M3 21v-6m0 0l2.77-.693a9 9 0 016.208.682l.108.054a9 9 0 006.086.71l3.114-.732a48.524 48.524 0 01-.005-10.499l-3.11.732a9 9 0 01-6.085-.711l-.108-.054a9 9 0 00-6.208-.682L3 4.5M3 15V4.5"
        />
      </svg>
    </button>

    <div
      class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-10 pointer-events-none"
    >
      <div
        class="w-12 h-12 bg-white/95 backdrop-blur-md rounded-full flex items-center justify-center text-primary shadow-xl transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500 ease-out"
      >
        <svg
          class="w-5 h-5 ml-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </div>
    </div>
  </div>

  <div class="p-4 md:p-5 flex flex-col flex-1 bg-surface z-20 relative">
    <h3
      class="font-display font-bold text-text-main text-[16px] md:text-[18px] leading-tight line-clamp-2 mb-4 group-hover:text-primary transition-colors"
    >
      {{ project.title }}
    </h3>

    <div class="mt-auto flex items-center justify-between pt-3 border-t border-border-main/10">
      <div class="flex items-center gap-2 max-w-[65%]">
        <img
          [src]="getAuthorAvatar(project.ownerId)"
          alt="Avatar"
          class="w-7 h-7 rounded-full object-cover border border-border-main/20 bg-bg shrink-0"
        />
        <span class="text-[12px] font-medium text-muted truncate">
          por <span class="text-text-main font-semibold">{{ getAuthorName(project.ownerId) }}</span>
        </span>
      </div>

      <button
        (click)="onLikeClick($event)"
        class="flex items-center gap-1.5 px-2 py-1.5 rounded-lg hover:bg-like/5 transition-colors focus:outline-none focus:ring-2 focus:ring-like/30 group/like shrink-0 z-20"
        title="Me gusta"
      >
        <svg
          class="w-5 h-5 transition-all duration-300"
          [class.text-like]="project.isLikedLocally"
          [class.fill-like]="project.isLikedLocally"
          [class.text-muted]="!project.isLikedLocally"
          [class.group-hover/like:text-like]="!project.isLikedLocally"
          [class.group-active/like:scale-75]="true"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"
          />
        </svg>
        <span
          class="text-[13px] font-semibold transition-colors"
          [class.text-like]="project.isLikedLocally"
          [class.text-muted]="!project.isLikedLocally"
        >
          {{ project.likesCount || 0 }}
        </span>
      </button>
    </div>
  </div>
</div>
