<div
  class="group flex flex-col h-full bg-surface rounded-3xl border border-border-main/10 overflow-hidden hover:border-primary/30 hover:shadow-xl hover:shadow-primary/5 transition-all duration-300"
>
  <a
    [routerLink]="['/home/proyectos', project._id]"
    class="relative h-48 bg-bg overflow-hidden block"
  >
    @if (coverImage) {
      <img
        [src]="coverImage"
        [alt]="project.title"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
      />
    } @else {
      <div
        class="w-full h-full flex flex-col items-center justify-center text-muted/40 bg-surface-hover/50 group-hover:bg-primary/5 transition-colors duration-500"
      >
        <svg
          class="w-12 h-12 mb-2 opacity-50"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
          />
        </svg>
        <span class="text-xs font-medium uppercase tracking-wider">Sin imagen</span>
      </div>
    }

    <div class="absolute top-3 right-3">
      <span
        class="px-3 py-1 bg-surface/90 backdrop-blur-md text-text-main text-xs font-bold rounded-full shadow-sm capitalize border border-border-main/10"
      >
        {{ project.status || 'Planificado' }}
      </span>
    </div>
  </a>

  <div class="p-5 flex flex-col flex-1">
    <a [routerLink]="['/home/proyectos', project._id]" class="block mb-2">
      <h3
        class="font-bold text-text-main text-[18px] group-hover:text-primary transition-colors line-clamp-1"
      >
        {{ project.title }}
      </h3>
    </a>

    <p class="text-[14px] text-muted mb-6 line-clamp-2 flex-1">
      {{
        project.description ||
          'Sin descripción detallada. Entra para añadir notas sobre este diseño.'
      }}
    </p>

    <div class="flex items-center justify-between pt-4 border-t border-border-main/10 mt-auto">
      <div class="flex items-center gap-3">
        <span
          class="text-xs font-bold text-primary bg-primary/10 px-2.5 py-1 rounded-lg flex items-center gap-1.5"
        >
          <svg
            class="w-3.5 h-3.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 011.875 1.875v1.5a1.875 1.875 0 01-1.875 1.875H5.625a1.875 1.875 0 01-1.875-1.875v-1.5c0-1.036.84-1.875 1.875-1.875z"
            />
          </svg>
          {{ project.steps.length || 0 }} pasos
        </span>
      </div>

      <div class="flex items-center gap-1">
        <button
          (click)="onDelete($event)"
          class="p-2 text-muted hover:bg-danger/10 hover:text-danger rounded-xl transition-colors"
          title="Eliminar proyecto"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
