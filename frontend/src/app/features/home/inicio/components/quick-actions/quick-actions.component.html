<section
  class="bg-surface rounded-4xl border border-border-main/10 p-5 shadow-[0_15px_40px_-10px_rgba(0,0,0,0.03)] h-full flex flex-col transition-all duration-500 hover:shadow-[0_20px_50px_-12px_rgba(0,0,0,0.05)]"
>
  <div class="flex items-center gap-2.5 mb-4 px-1">
    <div
      class="w-8 h-8 rounded-lg bg-primary/5 border border-primary/10 flex items-center justify-center text-primary shrink-0 shadow-inner"
    >
      <svg
        class="w-4.5 h-4.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M13.5 16.875h3.375m0 0h3.375m-3.375 0V13.5m0 3.375v3.375M6 10.5h2.25a2.25 2.25 0 002.25-2.25V6a2.25 2.25 0 00-2.25-2.25H6A2.25 2.25 0 003.75 6v2.25A2.25 2.25 0 006 10.5zm0 9.75h2.25A2.25 2.25 0 0010.5 18v-2.25a2.25 2.25 0 00-2.25-2.25H6a2.25 2.25 0 00-2.25 2.25V18A2.25 2.25 0 006 20.25zm9.75-9.75H18a2.25 2.25 0 002.25-2.25V6A2.25 2.25 0 0018 3.75h-2.25A2.25 2.25 0 0013.5 6v2.25a2.25 2.25 0 002.25 2.25z"
        />
      </svg>
    </div>
    <h2
      class="text-[17px] md:text-[19px] font-display font-bold text-text-main tracking-tight leading-tight"
    >
      Acciones rápidas
    </h2>
  </div>

  <div class="space-y-3.5 flex-1 flex flex-col justify-center">
    <button
      (click)="onCreateClick()"
      class="w-full flex items-center gap-4 p-4 rounded-[1.25rem] bg-bg border border-border-main/10 shadow-[inner_0_2px_4px_rgba(0,0,0,0.02)] transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group text-left cursor-pointer outline-none hover:border-primary/30 hover:shadow-[0_8px_25px_-5px_rgba(255,89,0,0.15)] hover:-translate-y-1 hover:bg-linear-to-r hover:from-surface hover:to-primary/5 active:scale-[0.98]"
    >
      <div
        class="w-11 h-11 md:w-12 md:h-12 rounded-xl bg-primary text-white flex items-center justify-center shadow-[0_4px_12px_rgba(255,89,0,0.3)] transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:scale-110 group-hover:rotate-90 group-hover:shadow-[0_6px_15px_rgba(255,89,0,0.4)] shrink-0"
      >
        <svg
          class="w-5 h-5 md:w-5.5 md:h-5.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </div>
      <div class="flex-1">
        <p
          class="font-display font-bold text-text-main text-[15px] md:text-[16px] group-hover:text-primary transition-colors duration-300"
        >
          Nuevo Proyecto
        </p>
        <p
          class="text-[13px] md:text-[14px] text-muted mt-0.5 opacity-80 group-hover:opacity-100 transition-opacity"
        >
          Sube un nuevo diseño
        </p>
      </div>
      <svg
        class="w-4.5 h-4.5 text-muted/30 group-hover:text-primary/60 group-hover:translate-x-1 transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <button
      class="w-full flex items-center gap-4 p-4 rounded-[1.25rem] bg-bg border border-border-main/10 shadow-[inner_0_2px_4px_rgba(0,0,0,0.02)] transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group text-left cursor-pointer outline-none hover:border-text-main/20 hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.08)] hover:-translate-y-1 hover:bg-linear-to-r hover:from-surface hover:to-surface-hover active:scale-[0.98]"
    >
      <div
        class="w-11 h-11 md:w-12 md:h-12 rounded-xl bg-surface border border-border-main/15 text-text-main flex items-center justify-center shadow-[0_2px_5px_rgba(0,0,0,0.05)] transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:scale-110 group-hover:border-text-main/30 shrink-0"
      >
        <svg
          class="w-5 h-5 md:w-5.5 md:h-5.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"
          />
        </svg>
      </div>
      <div class="flex-1">
        <p
          class="font-display font-bold text-text-main text-[15px] md:text-[16px] transition-colors duration-300"
        >
          Compartir proyecto
        </p>
        <p
          class="text-[13px] md:text-[14px] text-muted mt-0.5 opacity-80 group-hover:opacity-100 transition-opacity"
        >
          Comparte una de tus creaciones
        </p>
      </div>
      <svg
        class="w-4.5 h-4.5 text-muted/30 group-hover:text-text-main/60 group-hover:translate-x-1 transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>
  </div>
</section>
