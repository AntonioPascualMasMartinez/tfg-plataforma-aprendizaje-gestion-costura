<div class="flex items-center gap-2 mb-3 px-1 pb-2 border-b border-border-main/5">
  <div
    aria-hidden="true"
    class="w-7 h-7 rounded-lg bg-primary/5 border border-primary/10 flex items-center justify-center text-primary shrink-0 shadow-inner"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"
      />
    </svg>
  </div>
  <h2
    id="recommended-tutorial-heading"
    class="text-[17px] md:text-[19px] font-display font-bold text-text-main leading-tight"
  >
    Tutorial Recomendado
  </h2>
</div>

@if (isLoading) {
  <section
    aria-busy="true"
    aria-label="Cargando tutorial recomendado"
    class="bg-surface rounded-4xl border border-border-main/10 shadow-sm h-full min-h-64 flex flex-col animate-pulse overflow-hidden"
  >
    <div class="w-full h-36 bg-border-main/5 mb-4"></div>
    <div class="px-5 flex-1 flex flex-col">
      <div class="h-5 bg-border-main/10 rounded-md w-3/4 mb-3"></div>
      <div class="h-3.5 bg-border-main/5 rounded-md w-full mb-2"></div>
    </div>
  </section>
} @else if (tutorial) {
  <div class="flex-1 h-full">
    <app-tutorial-card
      [tutorial]="tutorial"
      (open)="onOpenTutorial($event)"
      aria-labelledby="recommended-tutorial-heading"
    >
    </app-tutorial-card>
  </div>
} @else {
  <section
    class="bg-surface rounded-4xl border border-border-main/10 p-5 shadow-[0_4px_24px_rgba(0,0,0,0.02)] flex flex-col items-center justify-center text-center h-full min-h-64"
  >
    <svg
      aria-hidden="true"
      class="w-8 h-8 text-muted/30 mb-2"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"
      />
    </svg>
    <p class="text-[13px] text-muted px-2">Pronto añadiremos clases.</p>
  </section>
}
