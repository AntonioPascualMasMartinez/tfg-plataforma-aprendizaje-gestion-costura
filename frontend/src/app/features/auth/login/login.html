<app-auth-shell
  imageUrl="/hero/hero-1.webp"
  quoteText="Retoma tus proyectos de costura justo donde los dejaste."
>
  <div class="mb-10 text-center sm:text-left">
    <h1
      class="text-[36px] md:text-[40px] font-display font-bold text-text-main tracking-tight mb-2"
    >
      Iniciar sesión
    </h1>
    <p class="text-[16px] text-muted">Ingresa tus datos para continuar creando.</p>
  </div>

  <div class="w-full flex justify-center mb-8 hover:scale-[1.02] transition-transform duration-300">
    <asl-google-signin-button type="standard" size="large" [width]="400"></asl-google-signin-button>
  </div>

  <div class="relative flex items-center mb-8">
    <div class="grow border-t border-border-main/15"></div>
    <span class="shrink-0 mx-4 text-muted/70 text-[12px] font-bold uppercase tracking-widest">
      O usa tu correo
    </span>
    <div class="grow border-t border-border-main/15"></div>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <div class="flex flex-col gap-2">
      <label for="email" class="text-[14px] font-semibold text-text-main ml-1">
        Correo electrónico
      </label>
      <div class="relative group">
        <div
          class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-muted group-focus-within:text-primary transition-colors"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"
            />
          </svg>
        </div>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="w-full h-13 pl-11 pr-4 rounded-2xl border border-border-main/15 bg-surface-hover/30 text-text-main outline-none focus:bg-surface focus:border-primary/50 focus:ring-4 focus:ring-primary/10 transition-all duration-300"
          [class.border-danger]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          [class.focus:ring-danger/20]="
            loginForm.get('email')?.invalid && loginForm.get('email')?.touched
          "
        />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between ml-1">
        <label for="password" class="text-[14px] font-semibold text-text-main"> Contraseña </label>
        <a
          routerLink="/auth/forgot-password"
          class="text-[13px] font-bold text-primary hover:text-[#E65000] transition-colors focus-visible:outline-focus rounded-sm"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>
      <div class="relative group">
        <div
          class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-muted group-focus-within:text-primary transition-colors"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
            />
          </svg>
        </div>
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full h-13 pl-11 pr-11 rounded-2xl border border-border-main/15 bg-surface-hover/30 text-text-main outline-none focus:bg-surface focus:border-primary/50 focus:ring-4 focus:ring-primary/10 transition-all duration-300"
          [class.border-danger]="
            loginForm.get('password')?.invalid && loginForm.get('password')?.touched
          "
          [class.focus:ring-danger/20]="
            loginForm.get('password')?.invalid && loginForm.get('password')?.touched
          "
        />

        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 pr-4 flex items-center text-muted hover:text-primary transition-colors focus:outline-none"
          tabindex="-1"
          aria-label="Alternar visibilidad de la contraseña"
        >
          @if (showPassword) {
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
              />
            </svg>
          } @else {
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          }
        </button>
      </div>
    </div>

    @if (errorMessage) {
      <div
        class="flex items-center gap-3 text-[14px] text-danger bg-danger/5 p-4 rounded-2xl border border-danger/20 font-medium animate-fadeIn"
      >
        <svg
          class="w-5 h-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading"
      class="btn btn-primary relative w-full h-13 mt-2 rounded-2xl shadow-[0_8px_20px_-6px_rgba(255,89,0,0.3)] hover:shadow-[0_12px_24px_-8px_rgba(255,89,0,0.45)] hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-60 disabled:hover:translate-y-0 disabled:hover:shadow-none text-[16px] overflow-hidden"
    >
      @if (isLoading) {
        <span class="flex items-center justify-center gap-2">
          <svg
            class="animate-spin h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Verificando...
        </span>
      } @else {
        Iniciar sesión
      }
    </button>
  </form>

  <p class="mt-8 text-center text-[15px] text-muted">
    ¿Aún no tienes una cuenta?
    <a
      routerLink="/auth/register"
      class="font-bold text-text-main hover:text-primary transition-colors focus-visible:outline-focus rounded-sm underline decoration-primary/30 underline-offset-4 hover:decoration-primary"
    >
      Regístrate gratis
    </a>
  </p>
</app-auth-shell>
