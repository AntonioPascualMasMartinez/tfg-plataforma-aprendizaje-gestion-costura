<app-auth-shell
  imageUrl="/hero/hero-1.jpg"
  badgeText="Bienvenido de nuevo"
  quoteText="Retoma tus proyectos donde los dejaste."
>
  <div class="mb-8">
    <h1 class="text-[32px] font-display font-bold text-text-main tracking-tight mb-2">
      Iniciar sesión
    </h1>
    <p class="text-[16px] text-muted">Ingresa tus datos para continuar.</p>
  </div>

  <div class="w-full flex justify-center mb-6">
    <asl-google-signin-button type="standard" size="large" [width]="400"></asl-google-signin-button>
  </div>

  <div class="relative flex items-center mb-6">
    <div class="flex-grow border-t border-border-main/20"></div>
    <span class="flex-shrink-0 mx-4 text-muted text-[14px] font-medium">O usa tu correo</span>
    <div class="flex-grow border-t border-border-main/20"></div>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="tu@email.com"
        class="h-[48px] px-4 rounded-xl border border-border-main/20 bg-surface text-text-main outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
        [class.border-danger]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
      />
    </div>

    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <label for="password">Contraseña</label>
        <a
          routerLink="/auth/forgot-password"
          class="text-[14px] font-semibold text-primary hover:text-[#E65000] transition-colors focus-visible:outline-focus rounded-sm"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="••••••••"
        class="h-[48px] px-4 rounded-xl border border-border-main/20 bg-surface text-text-main outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
        [class.border-danger]="
          loginForm.get('password')?.invalid && loginForm.get('password')?.touched
        "
      />
    </div>

    @if (errorMessage) {
      <div
        class="text-[14px] text-danger bg-danger/10 p-3 rounded-lg border border-danger/20 font-medium"
      >
        {{ errorMessage }}
      </div>
    }

    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading"
      class="btn btn-primary w-full mt-2 shadow-lg shadow-primary/20 hover:-translate-y-0.5 transition-all disabled:opacity-70 disabled:hover:translate-y-0"
    >
      @if (isLoading) {
        <svg
          class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        Verificando...
      } @else {
        Iniciar sesión
      }
    </button>
  </form>

  <p class="mt-8 text-center text-[15px] text-muted">
    ¿Aún no tienes una cuenta?
    <a
      routerLink="/auth/register"
      class="font-bold text-text-main hover:text-primary transition-colors focus-visible:outline-focus rounded-sm"
      >Regístrate gratis</a
    >
  </p>
</app-auth-shell>
