<app-auth-shell
  imageUrl="/hero/hero-3.webp"
  badgeText="Recupera tu acceso"
  quoteText="No pierdas el hilo de tus creaciones."
>
  <div class="mb-8">
    <h1 class="text-[32px] font-display font-bold text-text-main tracking-tight mb-2">
      ¿Olvidaste tu contraseña?
    </h1>
    <p class="text-[16px] text-muted">
      Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace seguro para
      restablecerla.
    </p>
  </div>

  <form [formGroup]="recoverForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="tu@email.com"
        class="h-12 px-4 rounded-xl border border-border-main/20 bg-surface text-text-main outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
      />
    </div>

    @if (errorMessage) {
      <div
        class="text-[14px] text-danger bg-danger/10 p-3 rounded-lg border border-danger/20 font-medium"
      >
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div
        class="text-[14px] text-success bg-success/10 p-4 rounded-lg border border-success/20 font-medium flex items-start gap-2"
      >
        <svg
          class="w-5 h-5 shrink-0 mt-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        {{ successMessage }}
      </div>
    }

    @if (!successMessage) {
      <button
        type="submit"
        [disabled]="recoverForm.invalid || isLoading"
        class="btn btn-primary w-full mt-2 shadow-lg shadow-primary/20 hover:-translate-y-0.5 transition-all disabled:opacity-70"
      >
        @if (isLoading) {
          Enviando...
        } @else {
          Enviar enlace de recuperación
        }
      </button>
    }
  </form>

  <div class="mt-8 flex justify-center">
    <a
      routerLink="/auth/login"
      class="group inline-flex items-center gap-2 text-[15px] font-bold text-text-main hover:text-primary transition-colors focus-visible:outline-focus rounded-sm px-1"
    >
      <svg
        class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Volver a iniciar sesión
    </a>
  </div>
</app-auth-shell>
