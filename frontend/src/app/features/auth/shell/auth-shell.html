<main class="min-h-svh w-full flex bg-bg font-sans">
  <div class="hidden lg:block lg:w-1/2 relative overflow-hidden bg-surface">
    <div class="absolute inset-0 bg-primary/10 mix-blend-multiply z-10 pointer-events-none"></div>
    <img
      [src]="imageUrl"
      alt="Proyecto Needly"
      class="absolute inset-0 w-full h-full object-cover z-0"
    />
    <div class="absolute bottom-12 left-12 z-20 max-w-md">
      <div
        class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/20 backdrop-blur-md text-white text-[14px] font-semibold mb-4 border border-white/30 shadow-lg"
      >
        <span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></span>
        {{ badgeText }}
      </div>
      <h2 class="text-white text-[40px] font-display font-bold leading-tight drop-shadow-md">
        {{ quoteText }}
      </h2>
    </div>
  </div>

  <div
    class="w-full lg:w-1/2 relative flex items-center justify-center p-6 sm:p-12 overflow-hidden"
  >
    <div
      class="absolute top-0 right-0 w-full h-full overflow-hidden pointer-events-none z-0 opacity-60"
    >
      <div
        class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[100px]"
      ></div>
      <div
        class="absolute bottom-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-focus/5 blur-[80px]"
      ></div>
    </div>

    <div class="w-full max-w-md relative z-10 flex flex-col">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 text-text-main font-display font-bold text-2xl mb-12 hover:opacity-80 transition-opacity w-fit focus-visible:outline-focus rounded-lg"
      >
        <div
          class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center shadow-sm"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </div>
        Needly
      </a>

      <ng-content></ng-content>
    </div>
  </div>
</main>
