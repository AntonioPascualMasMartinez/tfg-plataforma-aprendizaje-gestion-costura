<div class="max-w-6xl mx-auto">
  <h1 class="text-3xl font-display font-bold text-text-main mb-8">Panel de Control</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-surface p-6 rounded-2xl border border-border-main/15 shadow-sm">
      <h3 class="text-muted text-sm font-semibold uppercase tracking-wider mb-2">Total Usuarios</h3>
      <p class="text-4xl font-bold text-text-main">{{ totalUsers }}</p>
      <p class="text-success text-sm mt-2 font-medium">Estadística global</p>
    </div>
    <div class="bg-surface p-6 rounded-2xl border border-border-main/15 shadow-sm">
      <h3 class="text-muted text-sm font-semibold uppercase tracking-wider mb-2">
        Tutoriales Activos
      </h3>
      <p class="text-4xl font-bold text-text-main">{{ totalTutorials || 0 }}</p>
      <p class="text-success text-sm mt-2 font-medium">Disponibles en plataforma</p>
    </div>
    <div class="bg-surface p-6 rounded-2xl border border-border-main/15 shadow-sm">
      <h3 class="text-muted text-sm font-semibold uppercase tracking-wider mb-2">
        Pendientes de Moderación
      </h3>
      <p class="text-4xl font-bold text-danger">{{ pendingReports }}</p>
      <p class="text-danger/80 text-sm mt-2 font-medium">
        {{ pendingReports === 0 ? 'Todo al día' : 'Requieren atención' }}
      </p>
    </div>
  </div>
</div>
