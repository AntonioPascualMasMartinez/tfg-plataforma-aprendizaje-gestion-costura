<div class="min-h-screen w-full font-sans bg-bg flex">
  <aside class="w-65 h-screen fixed left-0 top-0 bg-surface border-r border-border-main/20 shadow-sm flex flex-col z-50">
    <div class="h-24 flex items-center px-8 mb-2 border-b border-border-main/10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary font-bold">
          A
        </div>
        <div>
          <span class="font-display text-[18px] font-bold text-text-main block leading-none">Admin Panel</span>
          <span class="text-[12px] text-muted">Needly</span>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-2 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-primary/10 text-primary"
           class="flex items-center gap-3.5 px-4 py-3 rounded-xl text-[14px] font-semibold text-muted hover:bg-surface-hover hover:text-text-main transition-colors">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path [attr.d]="item.icon"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="p-4 border-t border-border-main/10">
      <a routerLink="/home" class="flex items-center gap-3.5 px-4 py-3 w-full rounded-xl text-[14px] font-semibold text-muted hover:text-primary transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Volver a la App
      </a>
    </div>
  </aside>

  <main class="flex-1 ml-65 p-8 overflow-y-auto min-h-screen">
    <router-outlet></router-outlet>
  </main>
</div>
