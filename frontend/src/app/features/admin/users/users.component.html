<div class="max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-display font-bold text-text-main">Gestión de Usuarios</h1>
    <div class="relative">
      <input type="text" placeholder="Buscar usuario..." class="pl-10 pr-4 py-2 rounded-xl border border-border-main/20 bg-surface text-sm focus:ring-2 focus:ring-primary outline-none">
      <svg class="w-4 h-4 text-muted absolute left-4 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
    </div>
  </div>

  <div class="bg-surface rounded-2xl border border-border-main/15 shadow-sm overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-surface-hover/50 text-muted text-sm border-b border-border-main/10">
          <th class="py-4 px-6 font-semibold">Usuario</th>
          <th class="py-4 px-6 font-semibold">Rol</th>
          <th class="py-4 px-6 font-semibold">Nivel</th>
          <th class="py-4 px-6 font-semibold">Estado</th>
          <th class="py-4 px-6 font-semibold text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (user of mockUsers; track user.id) {
          <tr class="border-b border-border-main/5 hover:bg-surface-hover/30 transition-colors">
            <td class="py-4 px-6">
              <div class="font-bold text-text-main">{{ user.name }}</div>
              <div class="text-xs text-muted">{{ user.email }}</div>
            </td>
            <td class="py-4 px-6">
              <span class="px-2.5 py-1 text-xs font-bold rounded-lg"
                    [class]="user.role === 'Admin' ? 'bg-primary/10 text-primary' : 'bg-surface-hover text-muted'">
                {{ user.role }}
              </span>
            </td>
            <td class="py-4 px-6 text-sm text-text-main">{{ user.level }}</td>
            <td class="py-4 px-6">
              @if (user.isActive) {
                <span class="flex items-center gap-1.5 text-xs font-bold text-success"><div class="w-2 h-2 rounded-full bg-success"></div> Activo</span>
              } @else {
                <span class="flex items-center gap-1.5 text-xs font-bold text-danger"><div class="w-2 h-2 rounded-full bg-danger"></div> Baneado</span>
              }
            </td>
            <td class="py-4 px-6 text-right flex justify-end gap-2">
              <button class="text-xs font-semibold text-primary hover:underline">Cambiar Rol</button>
              <button class="text-xs font-semibold text-danger hover:underline ml-2">
                {{ user.isActive ? 'Banear' : 'Desbanear' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
