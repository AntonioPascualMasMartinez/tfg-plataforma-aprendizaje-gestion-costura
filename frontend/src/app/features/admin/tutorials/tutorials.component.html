<div class="max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-display font-bold text-text-main">Moderación de Tutoriales</h1>
    <button class="bg-primary text-white px-5 py-2.5 rounded-xl font-semibold shadow-md hover:-translate-y-0.5 transition-transform text-sm flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      Crear Tutorial Oficial
    </button>
  </div>

  <div class="bg-surface rounded-2xl border border-border-main/15 shadow-sm overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-surface-hover/50 text-muted text-sm border-b border-border-main/10">
          <th class="py-4 px-6 font-semibold">Título</th>
          <th class="py-4 px-6 font-semibold">Autor</th>
          <th class="py-4 px-6 font-semibold">Fecha</th>
          <th class="py-4 px-6 font-semibold">Estado</th>
          <th class="py-4 px-6 font-semibold text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (tut of mockTutorials; track tut.id) {
          <tr class="border-b border-border-main/5 hover:bg-surface-hover/30 transition-colors">
            <td class="py-4 px-6 font-bold text-text-main">{{ tut.title }}</td>
            <td class="py-4 px-6 text-sm text-muted">{{ tut.author }}</td>
            <td class="py-4 px-6 text-sm text-muted">{{ tut.date }}</td>
            <td class="py-4 px-6">
              @if (tut.status === 'Publicado') {
                <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-success/10 text-success">Publicado</span>
              } @else if (tut.status === 'Pendiente') {
                <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-[#E65000]/10 text-[#E65000]">Pendiente</span>
              } @else {
                <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-danger/10 text-danger">Rechazado</span>
              }
            </td>
            <td class="py-4 px-6 text-right flex justify-end gap-3">
              <button class="text-muted hover:text-success transition-colors" title="Aprobar" [disabled]="tut.status === 'Publicado'">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              </button>
              <button class="text-muted hover:text-danger transition-colors" title="Rechazar/Eliminar">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
