<section
  appScrollAnimate
  id="encontrar"
  class="w-full bg-surface py-24 px-6 md:px-12 relative overflow-hidden"
>
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <div
      class="absolute inset-0 opacity-20 dark:opacity-10 bg-[linear-gradient(to_right,var(--color-border-main)_1px,transparent_1px),linear-gradient(to_bottom,var(--color-border-main)_1px,transparent_1px)] bg-size-[24px_24px]"
    ></div>
    <div
      class="absolute top-0 left-0 w-[40vw] h-[40vw] rounded-full bg-rose-200/10 blur-[100px] transform-gpu"
    ></div>
    <div
      class="absolute bottom-0 right-0 w-[30vw] h-[30vw] rounded-full bg-pink-300/5 blur-[100px] transform-gpu"
    ></div>
  </div>

  <div class="max-w-7xl mx-auto relative z-10">
    <header class="mb-16 max-w-2xl">
      <h2
        class="text-5xl md:text-[64px] font-display font-bold tracking-tight text-text-main leading-[1.05]"
      >
        Todo lo que <br />
        <span
          class="text-shimmer text-transparent bg-clip-text bg-[linear-gradient(90deg,var(--color-primary),#FF8C42,var(--color-primary))] bg-size-[200%_auto]"
          >puedes encontrar</span
        >
      </h2>
      <p class="mt-6 text-[16px] md:text-[18px] text-muted leading-relaxed max-w-lg">
        Herramientas diseñadas específicamente para facilitar la vida de los apasionados por la
        costura.
      </p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 md:grid-rows-2 gap-6 lg:gap-8">
      @for (feature of features; track feature.title) {
        <article
          [class]="
            'group rounded-[2.5rem] border border-border-main/10 dark:border-white/5 bg-surface/90 backdrop-blur-md shadow-xl shadow-black/5 transition-[box-shadow,transform] duration-500 ease-out overflow-hidden cursor-pointer flex relative ' +
            feature.containerClass
          "
          style="transform: translateZ(0)"
        >
          <div
            [class]="
              'absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0 ' +
              feature.gradientClass
            "
          ></div>

          <div [class]="feature.textContainerClass">
            <div class="flex items-center justify-between mb-5 md:mb-6">
              <div
                [class]="
                  'w-14 h-14 rounded-3xl bg-bg border border-border-main/10 dark:border-white/5 shadow-sm flex items-center justify-center group-hover:scale-110 transition-all duration-500 ' +
                  feature.iconBtnClass
                "
              >
                <svg
                  [class]="'transition-colors ' + feature.iconColorClass"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  [attr.stroke-width]="feature.strokeWidth"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  @if (feature.icon === 'planning') {
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                    <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" />
                  } @else if (feature.icon === 'community') {
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  } @else if (feature.icon === 'learning') {
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                  }
                </svg>
              </div>
            </div>

            <h3
              [class]="
                'text-[22px] md:text-[24px] lg:text-[28px] font-display font-bold text-text-main transition-colors duration-300 ' +
                feature.titleHoverClass
              "
            >
              {{ feature.title }}
            </h3>
            <p
              class="mt-3 md:mt-4 text-[14px] md:text-[15px] lg:text-[16px] text-muted leading-relaxed max-w-[44ch] group-hover:text-text-main/90 transition-colors"
            >
              {{ feature.description }}
            </p>
          </div>

          <div [class]="feature.imageContainerClass">
            <div
              class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-500 z-10"
            ></div>
            <img
              [src]="feature.image"
              [alt]="feature.alt"
              class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110 transform-gpu will-change-transform"
            />
          </div>
        </article>
      }
    </div>
  </div>
</section>
